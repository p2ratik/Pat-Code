[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pat-agent"
version = "0.1.6"
description = "PAT — an AI coding agent built from scratch."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"


keywords = [
  "ai",
  "agent",
  "llm",
  "cli",
  "automation",
  "coding-agent"
]

dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "textual>=0.86.0",
    "click>=8.0.0",
    "keyring>=24.0.0",
    "platformdirs>=4.0.0",
    "tiktoken>=0.7.0",
    "fastmcp>=2.0.0",
    "ddgs>=9.0.0",
    "redis>=5.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    # repo_intel — code parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-bash>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-lua>=0.23.0",
    "tree-sitter-scala>=0.23.0",
    "tree-sitter-kotlin>=0.23.0",
    "tree-sitter-swift>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-php>=0.23.0",
    # repo_intel — graph / search
    "pathspec>=0.12.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.0",
    # interactive input
    "prompt-toolkit>=3.0.50",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://pat-agent.netlify.app/"
Repository = "https://github.com/p2ratik/Pat-Code"
Issues = "https://github.com/p2ratik/Pat-Code/issues"

# The CLI entry-point.
# "main:main" resolves to Pat-Code/main.py → the `main` click group,
# because Pat-Code/ is declared as the source root below.
[project.scripts]
pat-agent = "main:main"

# ---------------------------------------------------------------------------
# Setuptools configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
# All importable packages live inside Pat-Code/
where = ["Pat-Code"]

[tool.setuptools.package-dir]
# Map the empty root namespace to the Pat-Code/ subdirectory so that
# `import agent`, `import client`, `import config`, etc. all work.
"" = "Pat-Code"

[tool.setuptools]
# Include standalone modules used by entrypoints/tools under Pat-Code/.
py-modules = ["main", "apply_patch"]
